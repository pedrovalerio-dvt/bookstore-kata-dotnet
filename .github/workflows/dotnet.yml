name: .NET build and coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker
        run: docker info
      - name: Test unit, HTTP, and MongoDB integration paths
        shell: pwsh
        run: ./scripts/Test-Coverage.ps1
      - name: Verify formatting
        run: dotnet format Bookstore.slnx --verify-no-changes --no-restore --verbosity quiet
      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: warn
