components:
  schemas:
    Author:
      required:
      - id
      - name
      - active
      - createdAt
      - updatedAt
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        nationality:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Book:
      required:
      - id
      - categoryId
      - quantity
      - active
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        categoryId:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        description:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        active:
          type: boolean
        inactiveDate:
          type: string
          format: date-time
          nullable: true
        publisher:
          type: string
          nullable: true
        publisherDate:
          type: string
          format: date-time
          nullable: true
        authorId:
          type: string
          nullable: true
    CreateAuthorRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 255
          type: string
          description: Nonblank name; names need not be unique.
        birthDate:
          type: string
          description: Calendar date in YYYY-MM-DD format.
          format: date
          nullable: true
        nationality:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        active:
          type: boolean
          default: true
    CreateBookRequest:
      required:
      - title
      type: object
      properties:
        title:
          type: string
          description: Nonblank title. Duplicate titles remain allowed.
        author:
          type: string
          nullable: true
        categoryId:
          type: string
          description: Exact category NAME, not numeric ID. Omitted/null maps to category 0.
          nullable: true
        quantity:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: Absolute stock quantity; defaults to zero.
          format: int32
          default: 0
        description:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        active:
          type: boolean
          description: Defaults to true. Active books cannot have an inactiveDate.
          default: true
        inactiveDate:
          type: string
          description: UTC date-time; inactive creation defaults to server time if omitted.
          format: date-time
          nullable: true
        publisher:
          type: string
          nullable: true
        publisherDate:
          type: string
          format: date-time
          nullable: true
        authorId:
          pattern: ^[0-9a-fA-F]{24}$
          type: string
          description: Optional managed Author ID; cannot be supplied with author text.
          nullable: true
    ProblemDetails:
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
    UpdateBookRequest:
      required:
      - id
      - quantity
      - active
      type: object
      properties:
        id:
          pattern: ^[0-9a-fA-F]{24}$
          type: string
        quantity:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
        active:
          type: boolean
          description: False stamps inactiveDate with server time; true clears it.
tags:
- name: Books
- name: Authors
