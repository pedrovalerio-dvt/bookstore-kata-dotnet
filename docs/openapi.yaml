# Generated from the .NET API /openapi/v1.json; see docs/technical-architecture.md.
openapi: 3.0.4
info:
  title: Bookstore API
  description: 'MongoDB-backed .NET 10 API. No application authentication is configured. Errors use Problem
    Details with a trace instance and X-Trace-Id header. Dates are ISO 8601 date-times. Null response
    properties are omitted. Category names are case-sensitive: Fiction, Non-Fiction, Science, Biography,
    Children, Programming. Collection author search uses a case-insensitive literal substring and can
    be combined with category or authorId. Managed Author profiles require deployment access protection;
    soft deletion preserves linked books.'
  version: 1.2.0
servers:
- url: /
paths:
  /api/books:
    get:
      tags:
      - Books
      summary: List books by optional category, author text, and Author ID.
      description: authorId is exact identity; author is a case-insensitive literal substring and is not
        trimmed. All supplied filters combine with AND. Invalid IDs, blank author text, and unknown/empty
        category return 400. Missing filters list all books, including inactive ones. Null/missing authors
        do not match an author text search. No matches returns an empty array. Inactive Authors' books
        remain visible. No pagination or guaranteed ordering.
      operationId: ListBooks
      parameters:
      - name: category
        in: query
        description: Exact category name; combined with author using AND.
        schema:
          type: string
      - name: author
        in: query
        description: Optional nonblank, case-insensitive literal author substring. Whitespace is not trimmed.
        schema:
          type: string
      - name: authorId
        in: query
        description: Optional exact managed Author ID; all supplied filters combine with AND.
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Books
      summary: Create a book; categoryId accepts an exact category name.
      description: Requires a nonblank title and nonnegative quantity. Supply author text or authorId,
        not both. Managed links snapshot the active Author name transactionally; unknown Author returns
        404 and inactive Author returns 409. Unknown categories return 400. Inactive creation without
        a date uses server UTC time.
      operationId: CreateBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
        required: true
      responses:
        '201':
          description: Created
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
            Location:
              description: Lookup URL for the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - Books
      summary: Set quantity and active status, returning the complete persisted book.
      description: Id, quantity, and active must all be supplied. An unmatched ID returns 404; this does
        not insert a book. Deactivation stamps inactiveDate and activation clears it.
      operationId: UpdateBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
