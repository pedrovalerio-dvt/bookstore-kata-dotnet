    get:
      tags:
      - Authors
      summary: List active Authors; optionally include inactive profiles.
      description: includeInactive defaults to false. No pagination or ordering guarantee. Empty results
        return [].
      operationId: ListAuthors
      parameters:
      - name: includeInactive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
