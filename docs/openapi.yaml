    delete:
      tags:
      - Authors
      summary: Soft-delete an Author without changing linked books.
      description: Repeated retirement returns 204 without changing updatedAt. New links are rejected
        transactionally; this is not privacy erasure.
      operationId: DeactivateAuthor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
        '400':
