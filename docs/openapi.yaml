        route returns 400; use the collection endpoint for author searches.
      operationId: GetBook
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: author
        in: query
        schema:
          type: string
      - name: authorId
