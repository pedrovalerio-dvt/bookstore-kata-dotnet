      summary: HTTP liveness only; does not query MongoDB.
      operationId: BooksHealth
      responses:
        '200':
          description: OK
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
  /api/authors:
    post:
      tags:
      - Authors
      summary: Create a managed Author; duplicate names are allowed.
      description: Requires a nonblank name of at most 255 characters. Profile access is deployment-protected;
        the application does not configure authentication.
      operationId: CreateAuthor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
        required: true
      responses:
        '201':
          description: Created
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
            Location:
              description: Lookup URL for the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
