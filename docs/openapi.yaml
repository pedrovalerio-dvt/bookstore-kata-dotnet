# Generated from the .NET API /openapi/v1.json; see docs/technical-architecture.md.
openapi: 3.0.4
info:
  title: Bookstore API
  description: 'MongoDB-backed .NET 10 API. No application authentication is configured. Errors use Problem
    Details with a trace instance and X-Trace-Id header. Dates are ISO 8601 date-times. Null response
    properties are omitted. Category names are case-sensitive: Fiction, Non-Fiction, Science, Biography,
    Children, Programming. Collection author search uses a case-insensitive literal substring and can
    be combined with category.'
  version: 1.1.0
servers:
- url: /
paths:
  /api/books:
    get:
      tags:
      - Books
      summary: List books by optional category and partial author name.
      description: Author is a case-insensitive literal substring and is not trimmed; blank input returns
        400. Author and exact category filters combine with AND. Missing filters list all books, including
        inactive ones. Null/missing authors do not match an author search. Unknown or empty category returns
        400. No matches returns an empty array. No pagination or guaranteed ordering.
      operationId: ListBooks
      parameters:
      - name: category
        in: query
        description: Exact category name; combined with author using AND.
        schema:
          type: string
      - name: author
        in: query
        description: Optional nonblank, case-insensitive literal author substring. Whitespace is not trimmed.
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Books
      summary: Create a book; categoryId accepts an exact category name.
      description: Requires a nonblank title and nonnegative quantity. Unknown categories return 400.
        Inactive creation without a date uses server UTC time.
      operationId: CreateBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
        required: true
      responses:
        '201':
          description: Created
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
            Location:
              description: Lookup URL for the created book.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - Books
      summary: Set quantity and active status, returning the complete persisted book.
      description: Id, quantity, and active must all be supplied. An unmatched ID returns 404; this does
        not insert a book. Deactivation stamps inactiveDate and activation clears it.
      operationId: UpdateBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/books/single:
    get:
      tags:
      - Books
      summary: Find a book by exactly one of id or exact title.
      description: Supply exactly one of id or name. Author filtering on this single-book route returns
        400; use GET /api/books?author=... for collection search.
      operationId: GetBook
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: author
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/books/health:
    get:
      tags:
      - Books
      summary: HTTP liveness only; does not query MongoDB.
      operationId: BooksHealth
      responses:
        '200':
          description: OK
          headers:
            X-Trace-Id:
              description: Trace identifier correlating the response, Problem Details, and JSON logs.
              schema:
                type: string
components:
  schemas:
    Book:
      required:
      - id
      - categoryId
      - quantity
      - active
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        categoryId:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        description:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        active:
          type: boolean
        inactiveDate:
          type: string
          format: date-time
          nullable: true
        publisher:
          type: string
          nullable: true
        publisherDate:
          type: string
          format: date-time
          nullable: true
    CreateBookRequest:
      required:
      - title
      type: object
      properties:
        title:
          type: string
          description: Nonblank title. Duplicate titles remain allowed.
        author:
          type: string
          nullable: true
        categoryId:
          type: string
          description: Exact category NAME, not numeric ID. Omitted/null maps to category 0.
          nullable: true
        quantity:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: Absolute stock quantity; defaults to zero.
          format: int32
          default: 0
        description:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        active:
          type: boolean
          description: Defaults to true. Active books cannot have an inactiveDate.
          default: true
        inactiveDate:
          type: string
          description: UTC date-time; inactive creation defaults to server time if omitted.
          format: date-time
          nullable: true
        publisher:
          type: string
          nullable: true
        publisherDate:
          type: string
          format: date-time
          nullable: true
    ProblemDetails:
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
    UpdateBookRequest:
      required:
      - id
      - quantity
      - active
      type: object
      properties:
        id:
          pattern: ^[0-9a-fA-F]{24}$
          type: string
        quantity:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
        active:
          type: boolean
          description: False stamps inactiveDate with server time; true clears it.
tags:
- name: Books
